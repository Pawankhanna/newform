<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Party Form</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6f8;margin:0;padding:16px}
  .card{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0002}
  h2{margin-top:0}
  label{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}
  input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}
  .row{display:flex;gap:10px}.row>div{flex:1}
  button{margin-top:18px;width:100%;padding:12px;background:#1a73e8;color:#fff;border:0;border-radius:8px;font-size:16px}
  button:disabled{background:#999}
  #msg{margin-top:14px;padding:10px;border-radius:8px;display:none}
  .ok{background:#e6f4ea;color:#137333}.err{background:#fce8e6;color:#c5221f}
</style>
</head>
<body>
<div class="card">
  <h2>Tally - New Party</h2>
  <form id="f">
    <label>Party Name *</label><input name="name" required>
    <label>Group *</label>
    <select name="group"><option>Sundry Debtors</option><option>Sundry Creditors</option></select>
    <label>Address</label><textarea name="address" rows="2"></textarea>
    <div class="row">
      <div><label>State</label><input name="state" placeholder="Rajasthan"></div>
      <div><label>Pincode</label><input name="pincode" inputmode="numeric" maxlength="6"></div>
    </div>
    <div class="row">
      <div><label>Phone</label><input name="phone" inputmode="tel"></div>
      <div><label>Email</label><input name="email" type="email"></div>
    </div>
    <label>Order Amount (₹) *</label><input name="orderAmount" type="number" step="0.01" min="0" required>
    <button id="btn">Save Party</button>
  </form>
  <div id="msg"></div>
</div>

<script>
// ====== YAHAN APNI VALUES DAALO ======
const API_URL  = 'https://script.google.com/macros/s/AKfycbyQPqwmJjpQewnILazdyWGmN886GjN-NuPcQURr9iGK460cP7K7h4L-46T5EPKRXA/exec';
const FORM_KEY = 'Pawan@123';   // Code.gs wali key ke barabar
// =====================================

const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');

function show(text, ok){ msg.textContent = text; msg.className = ok ? 'ok' : 'err'; msg.style.display = 'block'; }

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(f));
  data.key = FORM_KEY;
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    // text/plain rakhne se CORS preflight nahi lagta
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(data)
    });
    const out = await res.json();
    show(out.msg + (out.id ? ' (ID: ' + out.id + ')' : ''), out.ok);
    if (out.ok) f.reset();
  } catch (err) {
    show('Network error: ' + err.message, false);
  }
  btn.disabled = false; btn.textContent = 'Save Party';
});
</script>
</body>
</html>
